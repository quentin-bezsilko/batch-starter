databaseChangeLog:
  - changeSet:
      id: 003-create-table-bank-transaction
      author: qbe
      changes:
        - createTable:
            schemaName: BATCHUSER
            tableName: BANK_TRANSACTION
            columns:
              - column:
                  name: ID
                  type: NUMBER
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ACCOUNT_ID
                  type: NUMBER
                  constraints:
                    nullable: false
              - column:
                  name: TRANSACTION_DATE
                  type: TIMESTAMP
              - column:
                  name: TRANSACTION_TYPE
                  type: VARCHAR2(50)
              - column:
                  name: AMOUNT
                  type: NUMBER(15,2)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
              - column:
                  name: VERSION
                  type: NUMBER
                  defaultValueNumeric: 0
        - addForeignKeyConstraint:
            constraintName: FK_TRANSACTION_ACCOUNT
            baseTableName: BANK_TRANSACTION
            baseColumnNames: ACCOUNT_ID
            referencedTableName: BANK_ACCOUNT
            referencedColumnNames: ID
        - createSequence:
            schemaName: BATCHUSER
            sequenceName: BANK_TRANSACTION_SEQ
            startValue: 1
            incrementBy: 1