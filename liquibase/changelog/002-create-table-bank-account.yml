databaseChangeLog:
  - changeSet:
      id: 002-create-table-bank-account
      author: qbe
      changes:
        - createTable:
            schemaName: BATCHUSER
            tableName: BANK_ACCOUNT
            columns:
              - column:
                  name: ID
                  type: NUMBER
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: CUSTOMER_ID
                  type: NUMBER
                  constraints:
                    nullable: false
              - column:
                  name: IBAN
                  type: VARCHAR2(34)
                  constraints:
                    nullable: false
              - column:
                  name: ACCOUNT_TYPE
                  type: VARCHAR2(20)
                  constraints:
                    nullable: false
              - column:
                  name: CURRENCY
                  type: VARCHAR2(3)
                  constraints:
                    nullable: false
              - column:
                  name: BALANCE
                  type: NUMBER(15,2)
                  defaultValueNumeric: 0
              - column:
                  name: ACCOUNT_STATUS
                  type: VARCHAR2(20)
                  constraints:
                    nullable: false
              - column:
                  name: OPENING_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
              - column:
                  name: VERSION
                  type: NUMBER
                  defaultValueNumeric: 0
        - addForeignKeyConstraint:
            constraintName: FK_ACCOUNT_CUSTOMER
            baseTableName: BANK_ACCOUNT
            baseColumnNames: CUSTOMER_ID
            referencedTableName: CUSTOMER
            referencedColumnNames: ID
        - createSequence:
            schemaName: BATCHUSER
            sequenceName: BANK_ACCOUNT_SEQ
            startValue: 1
            incrementBy: 1