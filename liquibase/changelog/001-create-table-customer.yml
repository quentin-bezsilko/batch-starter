databaseChangeLog:
  - changeSet:
      id: 001-create-table-customer
      author: qbe
      changes:
        - createTable:
            schemaName: BATCHUSER
            tableName: CUSTOMER
            columns:
              - column:
                  name: ID
                  type: NUMBER
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: FIRST_NAME
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false
              - column:
                  name: LAST_NAME
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false
              - column:
                  name: BIRTH_DATE
                  type: DATE
              - column:
                  name: COUNTRY
                  type: VARCHAR2(2)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
              - column:
                  name: VERSION
                  type: NUMBER
                  defaultValueNumeric: 0
        - createSequence:
            schemaName: BATCHUSER
            sequenceName: CUSTOMER_SEQ
            startValue: 1
            incrementBy: 1