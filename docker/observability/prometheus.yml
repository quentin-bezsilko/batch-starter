global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: batchstarter
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - batch:8080
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888