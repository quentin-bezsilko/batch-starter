services:

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: batchuser
      APP_USER_PASSWORD: batchpassword
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  liquibase:
    image: liquibase/liquibase:latest
    container_name: liquibase
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ../liquibase/changelog:/liquibase/changelog
      - ../liquibase/drivers:/liquibase/lib
    command:
      - --search-path=/liquibase/changelog
      - --url=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - --username=batchuser
      - --password=batchpassword
      - --changelog-file=master.yml
      - update

  batch:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: batch-app
    depends_on:
      - liquibase
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: batchuser
      SPRING_DATASOURCE_PASSWORD: batchpassword
    volumes:
      - ./output:/app/output

volumes:
  oracle-data: