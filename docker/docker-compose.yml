services:

  oracle:
    image: ${ORACLE_IMAGE}
    container_name: ${ORACLE_CONTAINER_NAME}
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD}
    ports:
      - "${ORACLE_PORT}:1521"
    volumes:
      - ${ORACLE_DATA_VOLUME}:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  liquibase:
    image: ${LIQUIBASE_IMAGE}
    container_name: ${LIQUIBASE_CONTAINER_NAME}
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ../liquibase/changelog:/liquibase/changelog
      - ../liquibase/drivers:/liquibase/lib
    command:
      - --search-path=/liquibase/changelog
      - --url=${LIQUIBASE_URL}
      - --username=${LIQUIBASE_USERNAME}
      - --password=${LIQUIBASE_PASSWORD}
      - --changelog-file=${LIQUIBASE_CHANGELOG_FILE}
      - update

  batch:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: ${BATCH_CONTAINER_NAME}
    depends_on:
      liquibase:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    volumes:
      - ./data/output:/app/data/output

volumes:
  oracle-data:
    name: ${ORACLE_DATA_VOLUME}
