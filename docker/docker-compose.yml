services:

  oracle:
    image: ${ORACLE_IMAGE}
    container_name: ${ORACLE_CONTAINER_NAME}
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD}
    ports:
      - "${ORACLE_PORT}:1521"
    volumes:
      - ${ORACLE_DATA_VOLUME}:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  liquibase:
    image: ${LIQUIBASE_IMAGE}
    container_name: ${LIQUIBASE_CONTAINER_NAME}
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ../liquibase/changelog:/liquibase/changelog
      - ../liquibase/drivers:/liquibase/lib
    command:
      - --search-path=/liquibase/changelog
      - --url=${LIQUIBASE_URL}
      - --username=${LIQUIBASE_USERNAME}
      - --password=${LIQUIBASE_PASSWORD}
      - --changelog-file=${LIQUIBASE_CHANGELOG_FILE}
      - update

  batch:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: ${BATCH_CONTAINER_NAME}
    depends_on:
      liquibase:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    volumes:
      - ./data/output:/app/data/output

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: ${OTEL_COLLECTOR_CONTAINER_NAME}
    command:
      - "--config=/etc/otel/config.yaml"
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
      - "${OTEL_PROMETHEUS_EXPORT_PORT}:8889"

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: ${PROMETHEUS_CONTAINER_NAME}
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: ${LOKI_IMAGE}
    container_name: ${LOKI_CONTAINER_NAME}
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"

  tempo:
    image: ${TEMPO_IMAGE}
    container_name: ${TEMPO_CONTAINER_NAME}
    user: "0:0"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    ports:
      - "${TEMPO_PORT}:3200"

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: ${GRAFANA_CONTAINER_NAME}
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning

  sonarqube:
    image: ${SONAR_IMAGE}
    container_name: ${SONAR_CONTAINER_NAME}
    ports:
      - "${SONAR_PORT}:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  oracle-data:
    name: ${ORACLE_DATA_VOLUME}
  grafana-data:
    name: ${GRAFANA_DATA_VOLUME}
  prometheus-data:
  loki-data:
  tempo-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
