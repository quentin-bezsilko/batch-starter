spring:
  config:
    activate:
      on-profile: otel

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  observations:
    annotations:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0

otel:
  service:
    name: ${SPRING_APPLICATION_NAME:batchstarter}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

logging:
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      [%thread]
      %-5level
      [%X{trace_id:-},%X{span_id:-}]
      %logger{36}
      - %msg%n
